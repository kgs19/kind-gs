apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          args: ["-port=8020"]
          ports:
            - containerPort: 8020
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-svc
spec:
  type: NodePort
  selector:
    app: whoami
  ports:
    - nodePort: 30080
      port: 8040
      targetPort: 8020
